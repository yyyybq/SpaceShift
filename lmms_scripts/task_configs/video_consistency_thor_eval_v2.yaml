dataset_path: "json"
dataset_kwargs:
  data_files: "/nas2/edwin/lmms-eval/data/video_consistency_thor_eval_v2.jsonl"
task: video_consistency_thor_eval_v2
test_split: "train"
output_type: generate_until

process_docs: !function utils.process_docs
doc_to_visual: !function utils.sceneshift_doc_to_visual
doc_to_text: !function utils.sceneshift_doc_to_text
doc_to_target: "ground_truth"

generation_kwargs:
  max_new_tokens: 32
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false

process_results: !function utils.sceneshift_process_results
metric_list:
  - metric: sceneshift_score
    aggregation: !function utils.video_consistency_aggregate_results
    higher_is_better: true

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""

metadata:
  - version: 2.0
